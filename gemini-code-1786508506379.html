<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b2b" />
    <title>UMA.Lab | 学習タイマー</title>
    <style>
:root {
  --ink: #f7fbff;
  --muted: rgba(235, 246, 255, 0.72);
  --panel: rgba(7, 22, 35, 0.52);
  --line: rgba(226, 244, 255, 0.21);
  --accent: #89e6dd;
  --accent-strong: #2db5c3;
  --danger: #ffc7ac;
  --background-top: #1a5f87;
  --background-bottom: #041b35;
  font-family: "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif;
  color: var(--ink);
  background: var(--background-bottom);
}

* { box-sizing: border-box; }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: linear-gradient(160deg, var(--background-top), var(--background-bottom));
}

button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 3px solid #f7e6a8;
  outline-offset: 3px;
}

.app-shell {
  width: min(100%, 1080px);
  min-height: 100vh;
  margin: auto;
  padding: 28px clamp(20px, 6vw, 74px) 30px;
  display: flex;
  flex-direction: column;
}

.topbar { display: flex; align-items: center; justify-content: space-between; }
.brand { color: var(--ink); text-decoration: none; font-size: 1.04rem; font-weight: 700; letter-spacing: 0.045em; display: inline-flex; align-items: center; gap: 9px; }
.brand-mark { width: 25px; height: 25px; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; border-radius: 50%; font-size: 1.25rem; line-height: 1; }

.icon-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--ink);
  background: rgba(1, 12, 23, 0.2);
  font-size: 1.35rem;
  transition: background 180ms ease, transform 180ms ease;
}
.icon-button:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }

.focus-panel { width: min(100%, 730px); margin: auto; text-align: center; }
.intro { margin: 60px 0 28px; }
.eyebrow { margin: 0 0 9px; color: var(--accent); font-size: 0.72rem; letter-spacing: 0.18em; font-weight: 700; }
h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 9px; font-weight: 650; font-size: clamp(1.8rem, 5vw, 2.9rem); letter-spacing: 0.02em; }
.subtitle { margin-bottom: 0; color: var(--muted); font-size: 0.98rem; }

.mode-tabs { display: inline-flex; padding: 4px; gap: 3px; border: 1px solid var(--line); border-radius: 999px; background: rgba(1, 15, 25, 0.33); }
.mode-tab { border: 0; border-radius: 999px; background: transparent; color: var(--muted); padding: 10px 16px; font-size: 0.88rem; transition: color 180ms ease, background 180ms ease; }
.mode-tab:hover { color: var(--ink); }
.mode-tab.is-active { color: #06202b; background: var(--accent); font-weight: 700; }

.timer-stage { margin: clamp(38px, 7vh, 70px) auto 26px; }
.phase-label { min-height: 1.4em; margin-bottom: 8px; color: var(--accent); font-weight: 700; font-size: 0.9rem; letter-spacing: 0.08em; }
.time-display { display: block; font-family: Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; font-size: clamp(4.8rem, 17vw, 10rem); line-height: 0.92; letter-spacing: -0.05em; text-shadow: 0 5px 30px rgba(0, 0, 0, 0.25); }
.progress-label { min-height: 1.4em; margin: 18px 0 0; color: var(--muted); font-size: 0.94rem; }

.setup-panel { min-height: 76px; display: flex; justify-content: center; align-items: center; gap: 10px; margin: 0 auto 28px; }
.setup-panel label { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--muted); font-size: 0.76rem; }
.setup-panel input { width: 74px; padding: 7px 4px; border: 1px solid var(--line); border-radius: 9px; background: rgba(3, 18, 28, 0.4); color: var(--ink); text-align: center; font-size: 1.18rem; }
.unit { margin-top: 18px; color: var(--muted); font-size: 1.4rem; }
.is-hidden { display: none; }

.pomodoro-setup { flex-direction: column; gap: 11px; }
.pomodoro-rule { color: var(--muted); font-size: 0.94rem; }
.rule-number { margin-right: 4px; color: var(--ink); font-family: Georgia, serif; font-size: 1.5rem; }
.rule-separator { margin: 0 12px; color: var(--accent); }
.set-count { flex-direction: row !important; gap: 9px !important; }
.set-count input { width: 55px; }

.controls { min-height: 49px; display: flex; align-items: center; justify-content: center; gap: 11px; }
.primary-button, .secondary-button, .text-button { border: 0; transition: transform 180ms ease, background 180ms ease, opacity 180ms ease; }
.primary-button { padding: 13px 28px; border-radius: 999px; color: #06222a; background: var(--accent); font-weight: 750; box-shadow: 0 8px 25px rgba(33, 180, 186, 0.2); }
.primary-button:hover { transform: translateY(-2px); background: #b0f4e8; }
.secondary-button { padding: 12px 20px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: rgba(5, 22, 34, 0.31); }
.secondary-button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
.secondary-button:disabled { opacity: 0.42; cursor: not-allowed; }
.text-button { padding: 8px 6px; color: var(--muted); background: transparent; font-size: 0.9rem; }
.text-button:hover { color: var(--ink); }
.status-message { min-height: 1.4em; margin: 24px 0 0; color: rgba(237, 248, 255, 0.6); font-size: 0.83rem; }

.page-footer { display: flex; justify-content: center; align-items: center; gap: 9px; padding-top: 26px; color: rgba(237, 248, 255, 0.58); font-size: 0.76rem; }
.footer-dot { color: var(--accent); }
.footer-link { padding: 0; border: 0; color: var(--accent); background: transparent; text-decoration: underline; text-underline-offset: 3px; }

.settings-dialog { width: min(calc(100% - 30px), 555px); max-height: min(90vh, 760px); padding: 0; border: 1px solid rgba(221, 243, 255, 0.23); border-radius: 22px; color: var(--ink); background: #0b2332; box-shadow: 0 25px 90px rgba(0, 0, 0, 0.48); }
.settings-dialog::backdrop { background: rgba(0, 5, 11, 0.6); backdrop-filter: blur(3px); }
.settings-dialog form { padding: clamp(23px, 5vw, 34px); overflow-y: auto; }
.dialog-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
.dialog-heading h2 { margin-bottom: 0; font-size: 1.65rem; }
.dialog-description { margin: 22px 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
.theme-list { display: grid; gap: 9px; margin: 0; padding: 0; border: 0; }
.theme-list legend { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.theme-card { display: grid; grid-template-columns: auto 54px 1fr; align-items: center; gap: 12px; padding: 9px; border: 1px solid transparent; border-radius: 13px; background: rgba(255, 255, 255, 0.045); cursor: pointer; }
.theme-card:has(input:checked) { border-color: var(--accent); background: rgba(137, 230, 221, 0.11); }
.theme-card input { accent-color: var(--accent); }
.theme-card strong, .theme-card small { display: block; }
.theme-card strong { margin-bottom: 3px; font-size: 0.95rem; }
.theme-card small { color: var(--muted); font-size: 0.75rem; }
.theme-preview { width: 54px; height: 42px; border-radius: 9px; }
.ocean-preview { background: linear-gradient(155deg, #7dd8d7, #146b91 62%, #092d59); }
.fire-preview { background: radial-gradient(circle at 48% 80%, #ffdb82 0 10%, #fa7c39 23%, #69323a 52%, #171528 100%); }
.forest-preview { background: radial-gradient(circle at 62% 25%, #cfebae 0 5%, #689169 6% 18%, #214c42 53%, #0b292a 100%); }

.volume-control { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-top: 19px; color: var(--muted); font-size: 0.85rem; }
.volume-control input { accent-color: var(--accent); }
.volume-control output { min-width: 3.2em; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.dialog-actions { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-top: 25px; }

.completion-toast { position: fixed; z-index: 3; top: 28px; left: 50%; min-width: min(400px, calc(100vw - 40px)); padding: 14px 19px; border: 1px solid rgba(255, 250, 212, 0.52); border-radius: 12px; color: #fffde9; background: rgba(34, 49, 35, 0.94); box-shadow: 0 12px 35px rgba(0, 0, 0, 0.24); text-align: center; transform: translate(-50%, -130px); transition: transform 250ms ease; }
.completion-toast.is-visible { transform: translate(-50%, 0); }

@media (max-width: 520px) {
  .app-shell { padding-top: 18px; }
  .intro { margin-top: 43px; }
  .mode-tab { padding: 9px 10px; font-size: 0.78rem; }
  .time-display { font-size: clamp(4.2rem, 23vw, 6rem); }
  .setup-panel { gap: 6px; }
  .setup-panel input { width: 62px; }
  .controls { gap: 6px; }
  .primary-button { padding-inline: 21px; }
  .secondary-button { padding-inline: 13px; }
  .page-footer { flex-wrap: wrap; }
}
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Focus Flow の先頭へ">
          <span class="brand-mark">◌</span>
          <span>UMA.Lab</span>
        </a>
        <button id="openSettings" class="icon-button" type="button" aria-label="テーマ設定を開く">
          <span aria-hidden="true">⚙</span>
        </button>
      </header>

      <section class="focus-panel" aria-labelledby="pageTitle">
        <div class="intro">
          <p class="eyebrow">MULT STUDY TIMER</p>
          <h1 id="pageTitle">もう一歩。</h1>
          <p class="subtitle">「あと一秒」を積み重ねよう。</p>
        </div>

        <nav class="mode-tabs" aria-label="計測モード">
          <button class="mode-tab is-active" type="button" data-mode="timer">タイマー</button>
          <button class="mode-tab" type="button" data-mode="stopwatch">ストップウォッチ</button>
          <button class="mode-tab" type="button" data-mode="pomodoro">ポモドーロ</button>
        </nav>

        <section class="timer-stage" aria-live="polite">
          <p id="phaseLabel" class="phase-label">設定した時間</p>
          <output id="timeDisplay" class="time-display" aria-label="残り時間">25:00</output>
          <p id="progressLabel" class="progress-label">準備ができたら開始してください</p>
        </section>

        <section id="timerSetup" class="setup-panel" aria-label="タイマー時間の設定">
          <label>
            <span>時間</span>
            <input id="timerHours" type="number" inputmode="numeric" min="0" max="23" value="0" />
          </label>
          <span class="unit">:</span>
          <label>
            <span>分</span>
            <input id="timerMinutes" type="number" inputmode="numeric" min="0" max="59" value="25" />
          </label>
          <span class="unit">:</span>
          <label>
            <span>秒</span>
            <input id="timerSeconds" type="number" inputmode="numeric" min="0" max="59" value="0" />
          </label>
        </section>

        <section id="pomodoroSetup" class="setup-panel pomodoro-setup is-hidden" aria-label="ポモドーロ設定">
          <div class="pomodoro-rule">
            <span class="rule-number">30</span><span>分 作業</span>
            <span class="rule-separator">＋</span>
            <span class="rule-number">5</span><span>分 休憩</span>
          </div>
          <label class="set-count">
            <span>繰り返すセット数</span>
            <input id="pomodoroSets" type="number" inputmode="numeric" min="1" max="12" value="4" />
            <span>セット</span>
          </label>
        </section>

        <div class="controls">
          <button id="startButton" class="primary-button" type="button">開始する</button>
          <button id="pauseButton" class="secondary-button" type="button" disabled>一時停止</button>
          <button id="resetButton" class="text-button" type="button">リセット</button>
        </div>

        <p id="statusMessage" class="status-message" role="status">現在のテーマ：Ocean</p>
      </section>

      <footer class="page-footer">
        <span id="themeCaption">Ocean — 波音の環境</span>
        <span class="footer-dot" aria-hidden="true">•</span>
        <button id="footerSettings" class="footer-link" type="button">テーマを変更</button>
      </footer>
    </main>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <form id="settingsForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">FOCUS THEMA</p>
            <h2 id="settingsTitle">集中テーマ</h2>
          </div>
          <button id="closeSettings" class="icon-button" type="button" aria-label="設定を閉じる">×</button>
        </div>

        <p class="dialog-description">画面の配色と、作業BGMを選択。</p>
        <fieldset class="theme-list">
          <legend>テーマを選択</legend>
          <label class="theme-card" data-theme-card="ocean">
            <input type="radio" name="theme" value="ocean" checked />
            <span class="theme-preview ocean-preview" aria-hidden="true"></span>
            <span><strong>Ocean</strong><small>紺碧 + 波音</small></span>
          </label>
          <label class="theme-card" data-theme-card="fire">
            <input type="radio" name="theme" value="fire" />
            <span class="theme-preview fire-preview" aria-hidden="true"></span>
            <span><strong>Campfire</strong><small>ダークレッド + 焚火</small></span>
          </label>
          <label class="theme-card" data-theme-card="forest">
            <input type="radio" name="theme" value="forest" />
            <span class="theme-preview forest-preview" aria-hidden="true"></span>
            <span><strong>Forest</strong><small>深緑 + 雨音</small></span>
          </label>
        </fieldset>

        <label class="volume-control">
          <span>音量</span>
          <input id="volumeControl" type="range" min="0" max="100" value="35" />
          <output id="volumeValue">35%</output>
        </label>
        <div class="dialog-actions">
          <button class="primary-button" type="submit">保存する</button>
        </div>
      </form>
    </dialog>

    <div id="completionToast" class="completion-toast" role="alert" aria-live="assertive"></div>
    <audio id="themeAudio" loop preload="auto"></audio>
    <script>
"use strict";

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => [...document.querySelectorAll(selector)];

const elements = {
  display: $("#timeDisplay"),
  phaseLabel: $("#phaseLabel"),
  progressLabel: $("#progressLabel"),
  status: $("#statusMessage"),
  timerSetup: $("#timerSetup"),
  pomodoroSetup: $("#pomodoroSetup"),
  timerHours: $("#timerHours"),
  timerMinutes: $("#timerMinutes"),
  timerSeconds: $("#timerSeconds"),
  pomodoroSets: $("#pomodoroSets"),
  start: $("#startButton"),
  pause: $("#pauseButton"),
  reset: $("#resetButton"),
  modeTabs: $$(".mode-tab"),
  settings: $("#settingsDialog"),
  settingsForm: $("#settingsForm"),
  openSettings: $("#openSettings"),
  footerSettings: $("#footerSettings"),
  closeSettings: $("#closeSettings"),
  themeCaption: $("#themeCaption"),
  audio: $("#themeAudio"),
  volume: $("#volumeControl"),
  volumeValue: $("#volumeValue"),
  toast: $("#completionToast"),
};

const THEMES = {
  ocean: {
    label: "Ocean",
    caption: "Ocean — 波音の環境",
    accent: "#89e6dd",
    backgroundTop: "#1a5f87",
    backgroundBottom: "#041b35",
    audio: "assets/ocean.mp3",
  },
  fire: {
    label: "Campfire",
    caption: "Campfire — 焚火の環境",
    accent: "#ffcd8e",
    backgroundTop: "#4c2935",
    backgroundBottom: "#130d1c",
    audio: "assets/campfire.mp3",
  },
  forest: {
    label: "Forest",
    caption: "Forest — 雨音の環境",
    accent: "#c8edab",
    backgroundTop: "#4d7964",
    backgroundBottom: "#082a30",
    audio: "assets/forest.mp3",
  },
};

const FOCUS_MS = 30 * 60 * 1000;
const BREAK_MS = 5 * 60 * 1000;
const STORAGE_KEY = "focus-flow-settings-v2";

let savedSettings = loadSettings();
let state = {
  mode: "timer",
  status: "idle",
  remainingMs: 25 * 60 * 1000,
  elapsedMs: 0,
  deadline: 0,
  startedAt: 0,
  intervalId: null,
  pomodoro: { phase: "focus", set: 1 },
};
let toastTimer = null;
let audioContext = null;

function loadSettings() {
  try {
    return { theme: "ocean", volume: 35, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") };
  } catch {
    return { theme: "ocean", volume: 35 };
  }
}

function saveSettings() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(savedSettings));
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, Number(value) || 0));
}

function formatTime(milliseconds) {
  const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return hours > 0
    ? `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`
    : `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

function timerInputMilliseconds() {
  const hours = clamp(elements.timerHours.value, 0, 23);
  const minutes = clamp(elements.timerMinutes.value, 0, 59);
  const seconds = clamp(elements.timerSeconds.value, 0, 59);
  elements.timerHours.value = hours;
  elements.timerMinutes.value = minutes;
  elements.timerSeconds.value = seconds;
  return (hours * 3600 + minutes * 60 + seconds) * 1000;
}

function pomodoroSetCount() {
  const sets = clamp(elements.pomodoroSets.value, 1, 12);
  elements.pomodoroSets.value = sets;
  return sets;
}

function currentTheme() {
  return THEMES[savedSettings.theme];
}

function isFocusSession() {
  return state.mode !== "pomodoro" || state.pomodoro.phase === "focus";
}

function render() {
  if (state.mode === "stopwatch") {
    elements.display.value = formatTime(state.elapsedMs);
    elements.phaseLabel.textContent = "経過時間";
    elements.progressLabel.textContent = state.status === "running" ? "作業中…" : state.status === "paused" ? "一時停止中…" : "経過時間を計測します。";
  } else if (state.mode === "pomodoro") {
    elements.display.value = formatTime(state.remainingMs);
    elements.phaseLabel.textContent = state.pomodoro.phase === "focus" ? "作業時間" : "休憩時間";
    elements.progressLabel.textContent = `${state.pomodoro.set} / ${pomodoroSetCount()} セット${state.status === "paused" ? " ・ 一時停止中" : ""}`;
  } else {
    elements.display.value = formatTime(state.remainingMs);
    elements.phaseLabel.textContent = "残り時間";
    elements.progressLabel.textContent = state.status === "running" ? "作業中…" : state.status === "paused" ? "一時停止中…" : "時間を設定して開始してください。";
  }

  elements.start.textContent = state.status === "paused" ? "再開" : state.status === "running" ? "進行中" : state.status === "finished" ? "もう一度" : "開始";
  elements.start.disabled = state.status === "running";
  elements.pause.disabled = state.status !== "running";
  elements.status.textContent = `現在のテーマ：${currentTheme().label}`;
}

function clearTicker() {
  if (state.intervalId) window.clearInterval(state.intervalId);
  state.intervalId = null;
}

function start() {
  if (state.status === "running") return;
  if (state.status === "finished") reset();

  if (state.mode === "timer") {
    if (state.status === "idle") state.remainingMs = timerInputMilliseconds();
    if (state.remainingMs <= 0) {
      showToast("1秒以上の時間を設定してください。");
      return;
    }
    state.deadline = Date.now() + state.remainingMs;
  } else if (state.mode === "stopwatch") {
    state.startedAt = Date.now() - state.elapsedMs;
  } else {
    if (state.status === "idle") {
      state.pomodoro = { phase: "focus", set: 1 };
      state.remainingMs = FOCUS_MS;
    }
    state.deadline = Date.now() + state.remainingMs;
  }

  state.status = "running";
  clearTicker();
  state.intervalId = window.setInterval(tick, 250);
  syncThemeAudio();
  render();
}

function pause() {
  if (state.status !== "running") return;
  if (state.mode === "stopwatch") state.elapsedMs = Date.now() - state.startedAt;
  else state.remainingMs = Math.max(0, state.deadline - Date.now());
  state.status = "paused";
  clearTicker();
  stopThemeAudio();
  render();
}

function reset() {
  clearTicker();
  stopThemeAudio();
  state.status = "idle";
  state.elapsedMs = 0;
  state.pomodoro = { phase: "focus", set: 1 };
  state.remainingMs = state.mode === "timer" ? timerInputMilliseconds() : state.mode === "pomodoro" ? FOCUS_MS : 0;
  render();
}

function tick() {
  if (state.status !== "running") return;

  if (state.mode === "stopwatch") {
    state.elapsedMs = Date.now() - state.startedAt;
    render();
    return;
  }

  state.remainingMs = Math.max(0, state.deadline - Date.now());
  if (state.remainingMs > 0) {
    render();
    return;
  }

  if (state.mode === "timer") finish("タイマーが終了しました。おつかれさまでした。");
  else advancePomodoro();
}

function finish(message) {
  clearTicker();
  state.status = "finished";
  state.remainingMs = 0;
  stopThemeAudio();
  playBell();
  render();
  showToast(message);
  window.setTimeout(() => window.alert(message), 80);
}

function advancePomodoro() {
  if (state.pomodoro.phase === "focus") {
    state.pomodoro.phase = "break";
    state.remainingMs = BREAK_MS;
    state.deadline = Date.now() + BREAK_MS;
    stopThemeAudio();
    playBell();
    showToast("作業時間が終了しました。5分間、休憩しましょう。");
    window.setTimeout(() => window.alert("作業時間が終了しました。休憩を開始します。"), 80);
  } else if (state.pomodoro.set >= pomodoroSetCount()) {
    finish("すべてのポモドーロが終了しました。おつかれさまでした。");
    return;
  } else {
    state.pomodoro.set += 1;
    state.pomodoro.phase = "focus";
    state.remainingMs = FOCUS_MS;
    state.deadline = Date.now() + FOCUS_MS;
    syncThemeAudio();
    playBell();
    showToast("休憩時間が終了しました。次の作業を始めましょう。");
    window.setTimeout(() => window.alert("休憩時間が終了しました。次の作業を開始します。"), 80);
  }
  render();
}

function selectMode(mode) {
  if (mode === state.mode) return;
  clearTicker();
  stopThemeAudio();
  state.mode = mode;
  state.status = "idle";
  state.elapsedMs = 0;
  state.pomodoro = { phase: "focus", set: 1 };
  state.remainingMs = mode === "timer" ? timerInputMilliseconds() : mode === "pomodoro" ? FOCUS_MS : 0;
  elements.timerSetup.classList.toggle("is-hidden", mode !== "timer");
  elements.pomodoroSetup.classList.toggle("is-hidden", mode !== "pomodoro");
  elements.modeTabs.forEach((button) => button.classList.toggle("is-active", button.dataset.mode === mode));
  render();
}

function syncThemeAudio() {
  if (state.status === "running" && isFocusSession()) startThemeAudio();
  else stopThemeAudio();
}

function startThemeAudio() {
  const theme = currentTheme();
  if (!elements.audio.src.endsWith(theme.audio)) elements.audio.src = theme.audio;
  elements.audio.volume = savedSettings.volume / 100;
  elements.audio.play().catch(() => showToast("BGMを再生できませんでした。音声ファイルの配置を確認してください。"));
}

function stopThemeAudio() {
  elements.audio.pause();
  elements.audio.currentTime = 0;
}

function playBell() {
  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
    audioContext.resume();
    const now = audioContext.currentTime;
    [659.25, 783.99].forEach((frequency, index) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.0001, now + index * 0.16);
      gain.gain.exponentialRampToValueAtTime(0.1, now + 0.03 + index * 0.16);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85 + index * 0.16);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now + index * 0.16);
      oscillator.stop(now + 0.9 + index * 0.16);
    });
  } catch {
    // アラート表示は音声を使えない環境でも継続します。
  }
}

function applyTheme() {
  savedSettings = {
    theme: $("input[name=theme]:checked").value,
    volume: Number(elements.volume.value),
  };
  saveSettings();
  const theme = currentTheme();
  document.documentElement.style.setProperty("--accent", theme.accent);
  document.documentElement.style.setProperty("--background-top", theme.backgroundTop);
  document.documentElement.style.setProperty("--background-bottom", theme.backgroundBottom);
  elements.themeCaption.textContent = theme.caption;
  if (state.status === "running" && isFocusSession()) {
    stopThemeAudio();
    startThemeAudio();
  }
  render();
}

function openSettings() {
  elements.volume.value = savedSettings.volume;
  elements.volumeValue.value = `${savedSettings.volume}%`;
  const selected = $(`input[name="theme"][value="${savedSettings.theme}"]`);
  if (selected) selected.checked = true;
  elements.settings.showModal();
}

function showToast(message) {
  window.clearTimeout(toastTimer);
  elements.toast.textContent = message;
  elements.toast.classList.add("is-visible");
  toastTimer = window.setTimeout(() => elements.toast.classList.remove("is-visible"), 5500);
}

elements.modeTabs.forEach((button) => button.addEventListener("click", () => selectMode(button.dataset.mode)));
elements.start.addEventListener("click", start);
elements.pause.addEventListener("click", pause);
elements.reset.addEventListener("click", reset);
[elements.timerHours, elements.timerMinutes, elements.timerSeconds].forEach((input) => {
  input.addEventListener("input", () => {
    if (state.mode === "timer" && state.status === "idle") {
      state.remainingMs = timerInputMilliseconds();
      render();
    }
  });
});
elements.pomodoroSets.addEventListener("input", () => {
  if (state.mode === "pomodoro") render();
});
elements.openSettings.addEventListener("click", openSettings);
elements.footerSettings.addEventListener("click", openSettings);
elements.closeSettings.addEventListener("click", () => elements.settings.close());
elements.settingsForm.addEventListener("submit", (event) => {
  event.preventDefault();
  applyTheme();
  elements.settings.close();
  showToast("テーマ設定を保存しました。");
});
elements.volume.addEventListener("input", () => {
  elements.volumeValue.value = `${elements.volume.value}%`;
});
window.addEventListener("beforeunload", stopThemeAudio);

applyTheme();
reset();
    </script>
  </body>
</html>
